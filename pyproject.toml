[project]
name = "vimana"
version = "0.1.0"
description = "Real-time airspace intelligence platform"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["vimana_common*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends()/Query() defaults

[tool.ruff.lint.isort]
known-first-party = ["app", "vimana_common", "streaming", "ingest", "batch"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["frontend/", "data/"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = [".", "backend"]
